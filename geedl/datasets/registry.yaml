sentinel-2:
  collection: COPERNICUS/S2_SR_HARMONIZED
  bands:
    B1:  {desc: "Coastal aerosol",   res: 60}
    B2:  {desc: "Blue",              res: 10}
    B3:  {desc: "Green",             res: 10}
    B4:  {desc: "Red",               res: 10}
    B5:  {desc: "Red Edge 1",        res: 20}
    B6:  {desc: "Red Edge 2",        res: 20}
    B7:  {desc: "Red Edge 3",        res: 20}
    B8:  {desc: "NIR",               res: 10}
    B8A: {desc: "Narrow NIR",        res: 20}
    B9:  {desc: "Water vapour",      res: 60}
    B11: {desc: "SWIR-1",            res: 20}
    B12: {desc: "SWIR-2",            res: 20}
    SCL: {desc: "Scene class",       res: 20, scaled: false, internal: true}
  native_res: 10
  cloud_mask: s2_scl_mask
  scale_factor: 0.0001
  offset: 0.0
  date_property: system:time_start
  slc_off_date: null

sentinel-1-rtc:
  collection: OPERA/RTC/L2_V1/S1
  bands:
    VV:   {desc: "VV backscatter γ⁰ (linear power)", res: 30}
    VH:   {desc: "VH backscatter γ⁰ (linear power)", res: 30}
    HV:   {desc: "HV backscatter γ⁰ (linear power)", res: 30}
    HH:   {desc: "HH backscatter γ⁰ (linear power)", res: 30}
    mask: {desc: "Valid/layover/shadow mask",          res: 30, scaled: false, internal: true}
  native_res: 30
  cloud_mask: null
  scale_factor: null
  offset: 0.0
  date_property: system:time_start
  slc_off_date: null
  composite_strategy_override: mosaic

sentinel-1:
  collection: COPERNICUS/S1_GRD
  bands:
    VV:    {desc: "VV polarisation", res: 10}
    VH:    {desc: "VH polarisation", res: 10}
    angle: {desc: "Incidence angle", res: 10}
  native_res: 10
  cloud_mask: null
  scale_factor: null
  offset: 0.0
  date_property: system:time_start
  extra_filters:
    - {property: instrumentMode,       value: IW}
    - {property: orbitProperties_pass, value: DESCENDING}
  slc_off_date: null
  composite_strategy_override: mosaic

landsat-7:
