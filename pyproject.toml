[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "geedl"
version = "0.1.0"
description = "Local-first, resumable, high-throughput downloader for Google Earth Engine"
readme = "README.md"
requires-python = ">=3.12"
authors = [{ name = "geedl contributors" }]
license = { text = "MIT" }
dependencies = [
    "earthengine-api>=1.7",
    "geopandas>=1.0",
    "shapely>=2.0",
    "rasterio>=1.4",
    "numpy>=1.24",
    "typer>=0.12",
    "pydantic>=2.5",
    "pyyaml>=6.0",
    "pystac>=1.9",
    "pyarrow>=14.0",
    "aiohttp>=3.9",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-recording>=0.13",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "mypy>=1.10",
]

[project.scripts]
geedl = "geedl.cli:app"

[tool.setuptools.packages.find]
where = ["."]
include = ["geedl*"]

[tool.setuptools.package-data]
"geedl.datasets" = ["registry.yaml"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W", "B", "UP"]
ignore = ["E501"]
