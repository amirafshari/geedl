# Unique name for this job (used in logs, checkpoint DB, catalog).
job_name: sentinel2_full_bands

roi:
  path: assets/lavan-test.shp

dataset:
  name: sentinel-2
  bands:
    # null = all bands from registry (B1, B2, B3, B4, B5, B6, B7, B8, B8A, B9, B11, B12).
    select: null
  indices: []
  cloud_mask:
    enabled: true
    profile: auto
    mask_shadow: true
    mask_snow: false

date:
  start: "2026-05-06"
  end: "2026-05-06"

composite:
  strategy: median
  window:
    type: scene
    label_format: "%Y-%m-%d"

pipeline:
  concurrency: 8

output:
  dir: ./output
  format: COG
  dtype: float32

asset:
  project: ee-tat3
  base_path: projects/ee-tat3/assets

auth:
  method: service_account
  service_account_email: amir-840@ee-tat3.iam.gserviceaccount.com
  key_file: ee-tat3-835f3bd207eb.json
