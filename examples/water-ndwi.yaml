job_name: water_ndwi

roi:
  path: assets/iraq.shp

dataset:
  name: sentinel-2
  bands:
    # Drop source bands — keep only the NDWI index.
    select: []
  indices:
    - name: NDWI
  cloud_mask:
    enabled: true
    profile: auto
    mask_shadow: true
    mask_snow: false

date:
  start: "2026-05-01"
  end: "2026-05-08"

composite:
  strategy: median
  window:
    type: full_range
    label_format: "%Y-%m-%d"

pipeline:
  concurrency: 16

output:
  dir: ./output
  format: COG
  dtype: float32
  compression: DEFLATE

asset:
  project: ee-tat3
  base_path: projects/ee-tat3/assets

auth:
  method: service_account
  service_account_email: amir-840@ee-tat3.iam.gserviceaccount.com
  key_file: ee-tat3-835f3bd207eb.json
